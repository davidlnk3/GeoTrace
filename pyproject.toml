[project]
name = "geotrace"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gradio-client>=2.7.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mcp>=2.3",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
# Camera calibration (core/calibration.py). Not on PyPI, so it is installed from git.
calibration = [
    "geocalib @ git+https://github.com/cvg/GeoCalib.git",
    "torch",
    "torchvision",
    "opencv-python-headless",
    "kornia",
]
# OCR for the extract_text tool. EasyOCR pulls in torch, torchvision and opencv-python-headless.
ocr = [
    "easyocr>=1.7.2",
]
# Face safeguard for reverse_search_region (core/face_guard.py). zoom_image and the grid don't need it.
# OpenCV 5 dropped CascadeClassifier and the bundled Haar cascades, so stay on 4.x.
reverse-search = [
    "opencv-python-headless>=4.8,<5",
]
# Candidate location verification (core/mapillary.py, core/retrieval.py, core/matching.py).
# MegaLoc is loaded with torch.hub (it is not on PyPI), so only its runtime dependencies are listed.
# LightGlue is not on PyPI either, so it is installed from git, pinned to a commit.
verification = [
    "lightglue @ git+https://github.com/cvg/LightGlue.git@5a650c444718caffc2669dc0094cde908f42dd73",
    "torch",
    "torchvision",
    "safetensors",
    "numpy",
    "opencv-python-headless",
    "platformdirs",
]

[dependency-groups]
dev = [
    "numpy",  # imported by core/location_regions.py but not in the base dependencies
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
geotrace = "geotrace.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotrace"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120

[tool.uv]
# One OpenCV for every extra: opencv-python-headless. LightGlue and GeoCalib require opencv-python,
# and EasyOCR opencv-python-headless; both ship the same cv2 module, so installing both breaks it
# (removing or upgrading one deletes or mismatches the other's files). GeoTrace never opens a
# window, so the GUI build is dropped. Only uv applies this; see the README for pip.
# The lock resolves one version for all extras, so the reverse-search pin keeps everyone on 4.x.
exclude-dependencies = ["opencv-python"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# The Space app runs on Hugging Face with gradio and spaces, which are not project dependencies.
exclude = ["hf_space", ".venv", "**/__pycache__"]
