[project]
name = "geotrace"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gradio-client>=2.7.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mcp>=2.3",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
]

[project.scripts]
geotrace = "geotrace.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotrace"]
