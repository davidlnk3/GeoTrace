[project]
name = "geotrace"
license = "MIT"
license-files = ["LICENSE"]
version = "0.2.3"
requires-python = ">=3.11"
dependencies = [
    "gradio-client>=2.7.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mcp>=2.3",
    "numpy",  # core/location_regions.py, imported at startup by the location_guesser tool
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
# Camera calibration (core/calibration.py). Not on PyPI, so it is installed from git: a fork of
# cvg/GeoCalib whose only change is depending on opencv-python-headless instead of opencv-python.
calibration = [
    "geocalib @ git+https://github.com/davidlnk3/GeoCalib.git@81c46d450522a4527e44595d646f617f90e3c2d9",
    "torch",
    "torchvision",
    "opencv-python-headless>=4.8,<5",
    "kornia",
]
# OCR for the extract_text tool. EasyOCR pulls in torch, torchvision and opencv-python-headless.
ocr = [
    "easyocr>=1.7.2",
]
# Face safeguard for reverse_search_region (core/face_guard.py). view_image and the grid don't need it.
# OpenCV 5 dropped CascadeClassifier and the bundled Haar cascades, so stay on 4.x.
reverse-search = [
    "opencv-python-headless>=4.8,<5",
]
# Candidate location verification (core/mapillary.py, core/retrieval.py, core/matching.py).
# MegaLoc is loaded with torch.hub (it is not on PyPI), so only its runtime dependencies are listed.
# LightGlue is not on PyPI either, so it is installed from git, pinned to a commit of a fork: upstream
# 5a650c4 plus one commit that depends on opencv-python-headless instead of opencv-python.
verification = [
    "lightglue @ git+https://github.com/davidlnk3/LightGlue.git@a88b17bc606379f561a8bcbab974768a29917920",
    "torch",
    "torchvision",
    "safetensors",
    "numpy",
    "opencv-python-headless>=4.8,<5",
    "platformdirs",
]
# DINOv2 sun model for the lighting fallback of relative_sun_position (core/sun_model.py).
# The checkpoint is downloaded from the davidlnk3/geotrace-sun model repo on first use.
sun = [
    "torch",
    "transformers",
]
# Dating for time_from_objects: EVA02-CLIP time probing (core/time_objects.py) and the
# photographic-style year classifier (core/photo_dating.py). Weights download on first use.
geoclip = [
    "torch",
    "open_clip_torch",
    "safetensors",
]
# PLONK for the location_guesser tool (core/plonk_location.py, core/location_regions.py).
# diff-plonk pins scipy==1.13.1, which has no wheels for the newest Python, so it is left out of `all`.
plonk = [
    "diff-plonk",
    "reverse_geocoder",
]
# Every extra except plonk.
all = [
    "geotrace[calibration,ocr,reverse-search,verification,sun,geoclip]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
geotrace = "geotrace.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotrace"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120

[tool.uv]
# Every extra uses one OpenCV, opencv-python-headless 4.x: opencv-python ships the same cv2 module,
# so installing both breaks it. The LightGlue and GeoCalib forks above exist for this, so it also
# holds for package installs (uvx, pip), where [tool.uv] settings don't apply.
#
# diff-plonk pins scipy==1.13.1, which has no wheels after Python 3.12. PLONK runs with newer scipy,
# so the project lock lifts the pin. This only applies inside the project (uv sync / uv run):
# package installs get scipy 1.13.1, which is why the README's uvx command uses --python 3.12.
override-dependencies = ["scipy>=1.13.1"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# The Space app runs on Hugging Face with gradio and spaces, which are not project dependencies.
exclude = ["hf_space", ".venv", "**/__pycache__"]
