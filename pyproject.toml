[project]
name = "geotrace"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gradio-client>=2.7.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mcp>=2.3",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
# Camera calibration (core/calibration.py). Not on PyPI, so it is installed from git.
calibration = [
    "geocalib @ git+https://github.com/cvg/GeoCalib.git",
    "torch",
    "torchvision",
    "opencv-python",
    "kornia",
]

# Location guessing with GeoCLIP (tools/location_guesser_geoclip.py). Pinned to 1.1.0:
# 1.3.0 requires huggingface-hub<2, which conflicts with the huggingface-hub>=2.4.0 dependency.
# transformers<5: geoclip 1.1.0 expects CLIP's get_image_features to return a tensor.
geoclip = [
    "geoclip==1.1.0",
    "torch",
    "torchvision",
    "transformers>=4.28,<5",
]

[project.scripts]
geotrace = "geotrace.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotrace"]

[tool.hatch.metadata]
allow-direct-references = true
