[project]
name = "geotrace"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gradio-client>=2.7.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mcp>=2.3",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
# Camera calibration (core/calibration.py). Not on PyPI, so it is installed from git.
calibration = [
    "geocalib @ git+https://github.com/cvg/GeoCalib.git",
    "torch",
    "torchvision",
    "opencv-python",
    "kornia",
]
# OCR for the extract_text tool. EasyOCR pulls in torch, torchvision and opencv-python-headless.
ocr = [
    "easyocr>=1.7.2",
]

[dependency-groups]
dev = [
    "numpy",  # imported by core/location_regions.py but not in the base dependencies
    "pytest>=8",
    "ruff",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
geotrace = "geotrace.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotrace"]

[tool.hatch.metadata]
allow-direct-references = true
